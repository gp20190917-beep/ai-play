<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON STRIKE</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #4400ff66}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const W=480,H=720,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SC=1,CSS=1;
function resize(){CSS=Math.min(innerWidth/W,innerHeight/H);const d=window.devicePixelRatio||1;cv.style.width=W*CSS+'px';cv.style.height=H*CSS+'px';cv.width=Math.round(W*CSS*d);cv.height=Math.round(H*CSS*d);SC=cv.width/W;}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ang=(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);

/* ================= AUDIO ================= */
let AC=null,master,musicGain,noiseBuf,music=true;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.55;musicGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();
}
function tone(type,f1,f2,dur,vol,t,dest){if(!AC)return;t=t||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,freq,t,dest,hp){if(!AC)return;t=t||AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.setValueAtTime(freq,t);if(!hp)f.frequency.exponentialRampToValueAtTime(80,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
const sfxLast={};
function sfx(n,arg){if(!AC)return;const lim={shot:4,hit:3,graze:3,item:3,boom:3};if(lim[n]){if(frame-(sfxLast[n]||-99)<lim[n])return;sfxLast[n]=frame;}
  const now=AC.currentTime;
  switch(n){
    case 'shot':tone('square',1200,300,0.05,0.025);break;
    case 'hit':tone('square',300,150,0.03,0.03);break;
    case 'graze':tone('triangle',2400,1800,0.04,0.04);break;
    case 'item':tone('sine',1400,2200,0.06,0.06);break;
    case 'power':tone('square',400,1600,0.25,0.08);tone('square',600,2400,0.25,0.05,now+0.08);break;
    case 'boom':{const s=arg||1;noise(0.25+s*0.15,Math.min(0.7,0.25+s*0.08),1500+s*800);tone('sine',140,30,0.3+s*0.1,0.3);break;}
    case 'die':noise(1.2,0.6,4000);tone('sawtooth',600,40,1,0.2);break;
    case 'bomb':noise(1.5,0.6,6000);tone('sine',80,20,1.5,0.5);tone('sawtooth',200,2000,0.4,0.08);break;
    case 'warn':for(let i=0;i<4;i++){tone('sawtooth',440,440,0.3,0.08,now+i*0.6);tone('sawtooth',330,330,0.3,0.08,now+i*0.6+0.3);}break;
    case 'extend':[523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.15,0.07,now+i*0.1));break;
    case 'clear':[392,523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.3,0.07,now+i*0.15));break;
  }
}
const STEP=60/138/4;let nextNote=0,stepI=0;
const PROG=[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,55,59]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(type,f,dur,vol,t){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+0.05);}
function musicTick(){
  if(!AC||AC.state!=='running')return;
  const on=music&&!paused&&(state==='play'||state==='title');
  if(!on){nextNote=0;return;}
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.15){
    const bar=Math.floor(stepI/16)%4,s=stepI%16,ch=PROG[bar],t=nextNote,intense=state==='play'&&boss;
    if(s%2===0)note('sawtooth',mtof(ch[0]-12+(s%4===2?12:0)),STEP*1.8,0.07,t);
    note('square',mtof(ch[[1,2,3,2][s%4]]+12+(intense&&s>=8?12:0)),STEP*0.9,0.022,t);
    if(state==='play'){
      if(s%4===0)tone('sine',160,40,0.18,0.35,t,musicGain);
      if(s%8===4)noise(0.12,0.18,3500,t,musicGain);
      if(intense||s%2===1)noise(0.03,0.05,8000,t,musicGain,true);
    }
    nextNote+=STEP;stepI++;
  }
}

/* ================= SPRITES ================= */
const cache={};
function glow(c,r){r=Math.max(1,Math.round(r));const k=c+r;let s=cache[k];if(s)return s;const R=r*4;s=document.createElement('canvas');s.width=s.height=R*2;const g=s.getContext('2d');const gr=g.createRadialGradient(R,R,0,R,R,R);gr.addColorStop(0,'#ffffff');gr.addColorStop(0.22,'#ffffff');gr.addColorStop(0.3,c);gr.addColorStop(0.55,c+'55');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fillRect(0,0,R*2,R*2);return cache[k]=s;}
function spr(c,r,x,y){const s=glow(c,r);ctx.drawImage(s,x-s.width/2,y-s.height/2);}
function poly(n,r,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();}
function starShape(n,R,r){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?r:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();}

/* ================= STATE ================= */
const stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.8+0.2});
let hi=0;try{hi=+(localStorage.getItem('neonStrikeHi')||0);}catch(e){}
let state='title',paused=false,frame=0,score=0,stage=1,stageT=0,boss=null,shake=0,flash=0,combo=0,comboT=0,graze=0,nextExt=30000,overT=0,newRec=false,banner=null,pendingClear=false,bombT=0;
let pb=[],eb=[],en=[],pt=[],it=[],pops=[],sched=[];
const P={};const keys={};let startPress=false,bombReq=false,touchDX=0;
const COL={zako:'#ff3b6b',dart:'#3bf0ff',turret:'#ffa53b',spinner:'#c05bff',heavy:'#5bff8a',boss:'#ff3bd0'};
const D=()=>1+(stage-1)*0.3, BS=()=>Math.min(1.8,1+(stage-1)*0.12);
const mult=()=>Math.min(5,1+Math.floor(combo/15)*0.5);

function reset(){Object.assign(P,{x:W/2,y:H-110,r:2.5,power:1,lives:3,bombs:3,inv:120,cool:0,mcool:0,dead:0,tilt:0,focus:false});score=0;stage=1;stageT=0;boss=null;combo=0;comboT=0;graze=0;nextExt=30000;bombT=0;pb=[];eb=[];en=[];pt=[];it=[];pops=[];sched=[];newRec=false;pendingClear=false;showBanner('STAGE 1','START!','#3bf0ff');}
function showBanner(a,b,c){banner={a,b,c,t:150};}
function later(d,fn){sched.push({t:frame+d,fn});}
function runSched(){const due=sched.filter(s=>s.t<=frame);sched=sched.filter(s=>s.t>frame);due.forEach(s=>s.fn());}
function addScore(v,m=true){score+=Math.floor(v*(m?mult():1));if(score>=nextExt){nextExt=Math.floor(nextExt*2.5);P.lives=Math.min(P.lives+1,8);sfx('extend');popText(P.x,P.y-30,'1UP!','#5bff8a');}}
function popText(x,y,s,c){pops.push({x,y,s,c,l:60});}

/* ================= PARTICLES ================= */
function spark(x,y,c,n,sp,sz){if(pt.length>1200)return;for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(0.5,sp);pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(15,35)|0,m:35,c,s:sz||rnd(1.5,3),k:0});}}
function ringFx(x,y,c,vr,w,l){pt.push({x,y,r:4,vr,c,w,l,m:l,k:1});}
function explode(x,y,s,c){spark(x,y,c,10+s*10,2+s*1.5);spark(x,y,'#ffffff',4+s*3,1+s);ringFx(x,y,c,3+s*1.5,3,22);shake=Math.max(shake,s*3);flash=Math.max(flash,s*0.03);sfx('boom',s);}
function updPT(){for(const p of pt){p.l--;if(p.k){p.r+=p.vr;p.vr*=0.93;}else{p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;}}pt=pt.filter(p=>p.l>0);}

/* ================= BULLETS ================= */
function eShot(x,y,a,s,c,r,o){if(eb.length>1500)return;const b={x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,c,life:0};if(o)Object.assign(b,o);eb.push(b);}
function fan(x,y,a,n,sp,s,c,r,o){for(let i=0;i<n;i++)eShot(x,y,a+(i-(n-1)/2)*sp,s,c,r,o);}
function ring(x,y,n,s,off,c,r,o){for(let i=0;i<n;i++)eShot(x,y,off+i*TAU/n,s,c,r,o);}
const aim=e=>ang(e.x,e.y,P.x,P.y);

/* ================= ENEMIES ================= */
const DEF={
  zako:{hp:3,r:13,score:100,upd(e){e.y+=e.vy||2.2;e.x=e.x0+Math.sin(e.t*0.05+(e.ph||0))*40;
    if(e.y>0&&e.y<H*0.6&&e.t%Math.max(45,Math.floor(110/D()))===30)eShot(e.x,e.y,aim(e),3*BS(),'#ff3b6b',5);}},
  dart:{hp:2,r:11,score:120,upd(e){e.x+=e.vx;e.y+=e.vy;e.vy+=0.05;if(e.t===35)fan(e.x,e.y,aim(e),3,0.3,3.2*BS(),'#3bf0ff',4);}},
  turret:{hp:22,r:18,score:500,upd(e){if(e.t<70)e.y+=(e.ty-e.y)*0.06;else if(e.t<330){if(e.t%Math.floor(60/D())===0)fan(e.x,e.y,aim(e),5,0.22,3*BS(),'#ffa53b',5);}else{e.vy+=0.06;e.y+=e.vy;}}},
  spinner:{hp:40,r:20,score:800,upd(e){if(e.t<70)e.y+=(e.ty-e.y)*0.05;else if(e.t<340){if(e.t%5===0){const a=e.t*0.13,n=2+Math.min(3,stage-1);for(let i=0;i<n;i++)eShot(e.x,e.y,a+i*TAU/n,2.4*BS(),'#c05bff',5);}}else{e.vy+=0.05;e.y+=e.vy;}}},
  heavy:{hp:110,r:30,score:1500,upd(e){e.y+=0.6;if(e.t%Math.floor(80/D())===40)ring(e.x,e.y,14+stage*2,2.2*BS(),e.t*0.1,'#5bff8a',6);if(e.t%100===70)fan(e.x,e.y,aim(e),3,0.15,4*BS(),'#fff36b',7);}},
  boss:{hp:1500,r:45,score:0,upd(e){
    if(e.t<130){e.y+=(150-e.y)*0.04;e.inv=true;return;}
    if(e.invT>0){e.invT--;e.inv=true;}else e.inv=false;
    const tt=e.t-130;e.x=W/2+Math.sin(tt*0.012)*120;e.y=150+Math.sin(tt*0.025)*25;
    const r=e.hp/e.maxhp,ph=r>0.66?0:r>0.33?1:2;
    if(ph!==e.ph){if(e.ph!==undefined)phaseBreak(e);e.ph=ph;e.pt=0;}
    e.pt++;if(e.invT>0)return;
    const bs=BS(),p=e.pt;
    if(ph===0){
      if(p%45===0)fan(e.x,e.y+20,aim(e),7+stage,0.12,3.5*bs,'#ff3bd0',6);
      if(p%5===0){const a=Math.PI/2+Math.sin(p*0.05)*0.9;eShot(e.x-70,e.y+10,a,3*bs,'#3bf0ff',4);eShot(e.x+70,e.y+10,Math.PI-a,3*bs,'#3bf0ff',4);}
    }else if(ph===1){
      if(p%6===0){for(let i=0;i<5;i++){eShot(e.x,e.y,p*0.05+i*TAU/5,2.6*bs,'#ffd23b',5);eShot(e.x,e.y,-p*0.05+i*TAU/5,2.0*bs,'#ff3b6b',5);}}
      if(p%120===60)ring(e.x,e.y,24,1.8*bs,0,'#ffffff',9);
    }else{
      if(p%32===0){const n=18+stage*2,off=Math.random()*TAU;for(let i=0;i<n;i++){eShot(e.x,e.y,off+i*TAU/n,2.4*bs,'#7b5bff',5,{cv:0.012});eShot(e.x,e.y,off+i*TAU/n,2.4*bs,'#5bfff0',5,{cv:-0.012});}}
      if(p%60===15)for(let k=0;k<5;k++)later(k*4,()=>{if(boss&&!boss.inv)fan(boss.x,boss.y+20,aim(boss),3,0.1,5*bs,'#ffffff',6);});
    }
  }}
};
function spawn(type,x,y,o){const d=DEF[type];const hp=d.hp*(type==='boss'?D():1+(stage-1)*0.45);const e={type,x,y,x0:x,t:0,hp,maxhp:hp,r:d.r,score:d.score,flash:0,vx:0,vy:0,inv:false,invT:0};if(o)Object.assign(e,o);en.push(e);return e;}
const PAT=[
  {w:3,min:0,f:()=>{const x0=rnd(80,W-80);for(let i=0;i<5;i++)later(i*12,()=>spawn('zako',x0,-20,{x0,ph:i*0.6}));}},
  {w:2,min:0,f:()=>{const L=Math.random()<.5,y=rnd(60,200);for(let i=0;i<6;i++)later(i*10,()=>spawn('dart',L?-20:W+20,y,{vx:L?3.5:-3.5,vy:-0.5}));}},
  {w:2,min:8,f:()=>{spawn('turret',rnd(60,W/2-40),-30,{ty:rnd(100,220)});spawn('turret',rnd(W/2+40,W-60),-30,{ty:rnd(100,220)});}},
  {w:1.5,min:10,f:()=>{for(let i=0;i<8;i++){const x=40+i*57;later(i*8,()=>spawn('zako',x,-20,{x0:x,ph:0,vy:2.8}));}}},
  {w:1.2,min:15,f:()=>spawn('spinner',rnd(120,W-120),-30,{ty:rnd(120,200)})},
  {w:0.8,min:25,f:()=>spawn('heavy',rnd(100,W-100),-50)},
];
function waves(){
  stageT++;
  if(stageT===60*52){showBanner('WARNING','BOSS APPROACHING','#ff3030');sfx('warn');}
  if(stageT===60*55)boss=spawn('boss',W/2,-120);
  if(boss||stageT>=60*50)return;
  const rate=Math.max(38,100-stage*12);
  if(stageT>60&&stageT%rate===0){
    const sec=stageT/60*Math.min(3,1+(stage-1)*0.5);
    const opts=PAT.filter(p=>sec>=p.min);let r=Math.random()*opts.reduce((a,p)=>a+p.w,0);
    for(const p of opts){r-=p.w;if(r<=0){p.f();break;}}
  }
}
function phaseBreak(e){for(const b of eb)drop(b.x,b.y,'S',true);eb=[];explode(e.x,e.y,4,'#ffffff');flash=0.7;e.invT=90;popText(e.x,e.y+60,'PHASE BREAK!','#ffd23b');}
function hurt(e,d){if(e.dead||e.inv)return;e.hp-=d;e.flash=3;sfx('hit');if(e.hp<=0)kill(e);}
function kill(e){e.dead=true;combo++;comboT=120;
  if(e.type==='boss'){bossDown(e);return;}
  const big=e.r>=18;const gain=Math.floor(e.score*mult());addScore(e.score);
  explode(e.x,e.y,big?3:1.2,COL[e.type]);
  if(big)popText(e.x,e.y,'+'+gain,'#ffffff');
  const n=big?Math.floor(e.r/3):1;for(let i=0;i<n;i++)drop(e.x,e.y,'S');
  if(Math.random()<(big?0.45:0.04))drop(e.x,e.y,'P');
  if(e.type==='heavy'&&Math.random()<0.3)drop(e.x,e.y,'B');}
function drop(x,y,t,mag){if(t==='S'&&it.length>250)return;it.push({x:x+rnd(-10,10),y:y+rnd(-10,10),vx:rnd(-1.5,1.5),vy:rnd(-3,-1),t,mag:!!mag});}
function bossDown(e){boss=null;
  for(const b of eb)drop(b.x,b.y,'S',true);eb=[];
  for(let i=0;i<8;i++)later(i*10,()=>explode(e.x+rnd(-70,70),e.y+rnd(-30,30),2.5,i%2?'#ff3bd0':'#ffd23b'));
  later(85,()=>{explode(e.x,e.y,6,'#ffffff');flash=1;shake=30;['#ff3bd0','#3bf0ff','#ffd23b','#ffffff'].forEach((c,i)=>ringFx(e.x,e.y,c,6+i*3,4,40));
    for(let i=0;i<30;i++)drop(e.x,e.y,'S',true);drop(e.x,e.y,'P',true);drop(e.x,e.y,'B',true);});
  const bonus=50000*stage;addScore(bonus,false);
  later(130,()=>{sfx('clear');showBanner('STAGE CLEAR','BONUS +'+bonus,'#ffd23b');});
  later(330,()=>{stage++;stageT=0;showBanner('STAGE '+stage,'DANGER LEVEL UP','#3bf0ff');});
}

/* ================= PLAYER ================= */
function updPlayer(){
  if(P.dead>0){P.dead--;if(P.dead===0){if(P.lives<=0){gameOver();return;}P.x=W/2;P.y=H-110;P.inv=180;}return;}
  P.focus=!!(keys.ShiftLeft||keys.ShiftRight||keys.KeyC);
  const sp=P.focus?2.3:5.2;let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx--;if(keys.ArrowRight||keys.KeyD)dx++;if(keys.ArrowUp||keys.KeyW)dy--;if(keys.ArrowDown||keys.KeyS)dy++;
  if(dx&&dy){dx*=0.7071;dy*=0.7071;}
  P.x+=dx*sp;P.y+=dy*sp;
  P.tilt+=((dx||clamp(touchDX*0.3,-1,1))-P.tilt)*0.2;touchDX=0;
  P.x=clamp(P.x,10,W-10);P.y=clamp(P.y,20,H-16);
  if(P.inv>0)P.inv--;
  if(--P.cool<=0){P.cool=5;fire();}
  if(P.power>=3&&--P.mcool<=0){P.mcool=P.power>=5?12:20;for(const s of[-1,1])pb.push({x:P.x+s*16,y:P.y,vx:s*3,vy:-2,d:2.5,m:1,tg:null});}
  if(bombReq)bomb();
  if(frame%2===0)pt.push({x:P.x+rnd(-2,2),y:P.y+14,vx:rnd(-0.3,0.3),vy:rnd(2,4),l:12,m:12,c:'#3b9dff',s:2.5,k:0});
}
function fire(){const x=P.x,y=P.y-14,p=P.power;
  const add=(ox,a,d)=>pb.push({x:x+ox,y,vx:Math.sin(a)*15,vy:-Math.cos(a)*15,d:d||1});
  add(-5,0);add(5,0);const s=P.focus?0.035:0.14;
  if(p>=2){add(-11,-s);add(11,s);}
  if(p>=4){add(-15,-s*2);add(15,s*2);}
  if(p>=5)add(0,0,1.5);
  sfx('shot');}
function nearest(b){let best=null,bd=1e9;for(const e of en){if(e.dead||e.inv||e.y<0)continue;const d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<bd){bd=d;best=e;}}return best;}
function updPB(){
  for(let i=pb.length-1;i>=0;i--){const b=pb[i];
    if(b.m){if(!b.tg||b.tg.dead||b.tg.inv)b.tg=nearest(b);
      const ca=Math.atan2(b.vy,b.vx);let da=b.tg?ang(b.x,b.y,b.tg.x,b.tg.y)-ca:-Math.PI/2-ca;
      while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
      const na=ca+clamp(da,-0.18,0.18),sp=Math.min(13,Math.hypot(b.vx,b.vy)+0.6);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      if(frame%2===0)pt.push({x:b.x,y:b.y,vx:0,vy:0,l:10,m:10,c:'#ff8a3b',s:2,k:0});}
    b.x+=b.vx;b.y+=b.vy;
    if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30){pb.splice(i,1);continue;}
    for(const e of en){if(e.dead||e.inv)continue;const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+6;
      if(dx*dx+dy*dy<rr*rr){hurt(e,b.d);if(Math.random()<0.5)spark(b.x,b.y,b.m?'#ff8a3b':'#8affff',2,3,1.5);pb.splice(i,1);break;}}
  }
}
function bomb(){if(P.bombs<=0||P.dead>0)return;P.bombs--;P.inv=Math.max(P.inv,160);flash=1;shake=22;sfx('bomb');
  for(const b of eb)drop(b.x,b.y,'S',true);eb=[];
  for(const e of en)hurt(e,e.type==='boss'?100:80);
  for(let i=0;i<5;i++)later(i*6,()=>ringFx(P.x,P.y,i%2?'#3bf0ff':'#ff3bd0',14,6,45));
  bombT=90;}
function hitPlayer(){if(P.inv>0||P.dead>0)return;
  explode(P.x,P.y,4,'#3bf0ff');spark(P.x,P.y,'#ffffff',40,8);sfx('die');shake=28;flash=0.6;
  P.lives--;P.dead=70;P.bombs=Math.max(P.bombs,3);combo=0;comboT=0;
  if(P.power>1){P.power--;drop(P.x,H*0.35,'P');}
  pendingClear=true;}
function gameOver(){state='over';overT=0;if(score>hi){hi=score;newRec=true;try{localStorage.setItem('neonStrikeHi',hi);}catch(e){}}}

function updEN(){
  for(const e of en){if(e.dead)continue;e.t++;DEF[e.type].upd(e);if(e.flash>0)e.flash--;
    if(e.type!=='boss'&&(e.y>H+60||e.x<-90||e.x>W+90||e.y<-200))e.dead=true;
    if(!e.dead&&!P.dead){const dx=e.x-P.x,dy=e.y-P.y,rr=e.r*0.7+P.r;
      if(dx*dx+dy*dy<rr*rr){const was=P.dead;hitPlayer();if(P.dead&&!was&&e.type!=='boss')hurt(e,30);}}}
  en=en.filter(e=>!e.dead);}
function updEB(){
  for(let i=eb.length-1;i>=0;i--){const b=eb[i];
    if(b.cv){const c=Math.cos(b.cv),s=Math.sin(b.cv),vx=b.vx*c-b.vy*s;b.vy=b.vx*s+b.vy*c;b.vx=vx;}
    b.x+=b.vx;b.y+=b.vy;b.life++;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30||b.life>700){eb.splice(i,1);continue;}
    if(P.dead>0)continue;
    const dx=b.x-P.x,dy=b.y-P.y,d2=dx*dx+dy*dy,hr=b.r*0.55+P.r;
    if(d2<hr*hr){if(P.inv<=0){hitPlayer();break;}}
    else if(!b.g&&d2<(b.r+16)*(b.r+16)){b.g=1;graze++;addScore(30,false);sfx('graze');spark(b.x,b.y,'#ffffff',2,2,1.2);}
  }
  if(bombT>0){bombT--;for(const b of eb)drop(b.x,b.y,'S',true);eb=[];}
  if(pendingClear){eb=[];pendingClear=false;}
}
function updIT(){
  for(let i=it.length-1;i>=0;i--){const t=it[i];const dx=P.x-t.x,dy=P.y-t.y,d=Math.hypot(dx,dy)||1;
    if(!P.dead&&(t.mag||P.y<H*0.3||d<(P.focus?100:60))){t.mag=true;const s=Math.min(11,d);t.x+=dx/d*s;t.y+=dy/d*s;}
    else{t.vx*=0.95;t.vy=Math.min(t.vy+0.07,2.2);t.x+=t.vx;t.y+=t.vy;}
    if(!P.dead&&d<20){collect(t);it.splice(i,1);continue;}
    if(t.y>H+20)it.splice(i,1);}}
function collect(t){
  if(t.t==='S'){addScore(50+Math.floor(graze/10)*5);sfx('item');}
  else if(t.t==='P'){if(P.power<5){P.power++;popText(P.x,P.y-30,P.power===5?'FULL POWER!':'POWER UP','#ffd23b');}else{addScore(5000,false);popText(P.x,P.y-30,'+5000','#ffd23b');}sfx('power');}
  else{P.bombs=Math.min(P.bombs+1,6);popText(P.x,P.y-30,'BOMB +1','#5bff8a');sfx('power');}}

/* ================= DRAW ================= */
function drawBG(){
  const h=(250+stage*35)%360;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${h},70%,5%)`);g.addColorStop(1,`hsl(${(h+40)%360},80%,9%)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=`hsla(${h},100%,65%,0.10)`;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=40){ctx.moveTo(x+0.5,0);ctx.lineTo(x+0.5,H);}
  const off=(frame*(boss?3:1.5))%40;for(let y=off-40;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  for(const s of stars){ctx.fillStyle=`rgba(210,220,255,${s.z})`;ctx.fillRect(s.x,s.y,s.z*2,s.z*(boss?10:5));}
}
function drawItem(t){
  if(t.t==='S'){spr('#ffd23b',2,t.x,t.y);return;}
  const c=t.t==='P'?'#ff3b6b':'#5bff8a';ctx.save();ctx.translate(t.x,t.y);ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;ctx.fillRect(-9,-9,18,18);
  ctx.shadowBlur=0;ctx.fillStyle='#ffffff';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.t,0,1);ctx.restore();}
function drawBoss(e){
  const pts=[[0,-45],[35,-25],[95,-35],[80,5],[45,15],[30,40],[0,28],[-30,40],[-45,15],[-80,5],[-95,-35],[-35,-25]];
  ctx.beginPath();pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
  for(const s of[-70,70]){ctx.beginPath();ctx.arc(s,10,9,0,TAU);ctx.stroke();}
  ctx.save();ctx.rotate(e.t*0.04);ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(0,0,34,0,TAU);ctx.stroke();ctx.restore();
  ctx.save();ctx.rotate(-e.t*0.06);poly(3,24,0);ctx.stroke();ctx.restore();
  ctx.shadowBlur=0;ctx.globalCompositeOperation='lighter';spr(e.ph===2?'#ff3030':'#ff3bd0',8+Math.sin(e.t*0.2)*2,0,0);
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  const col=COL[e.type],fl=e.flash>0;
  ctx.shadowBlur=14;ctx.shadowColor=col;ctx.lineWidth=2;ctx.strokeStyle=fl?'#ffffff':col;ctx.fillStyle=fl?'rgba(255,255,255,0.9)':'rgba(10,0,25,0.85)';
  if(e.inv&&e.type==='boss'&&e.t>130)ctx.globalAlpha=0.6+0.4*Math.sin(frame*0.5);
  switch(e.type){
    case 'zako':ctx.rotate(e.t*0.05);poly(4,14,0);ctx.fill();ctx.stroke();poly(4,6,Math.PI/4);ctx.stroke();break;
    case 'dart':ctx.rotate(Math.atan2(e.vy,e.vx));ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,9);ctx.lineTo(-5,0);ctx.lineTo(-10,-9);ctx.closePath();ctx.fill();ctx.stroke();break;
    case 'turret':poly(6,18,e.t*0.01);ctx.fill();ctx.stroke();ctx.rotate(aim(e));ctx.strokeRect(4,-3,16,6);ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.stroke();break;
    case 'spinner':ctx.rotate(e.t*0.1);starShape(5,22,10);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.stroke();break;
    case 'heavy':poly(8,30,Math.PI/8);ctx.fill();ctx.stroke();ctx.rotate(e.t*0.03);poly(4,16,0);ctx.stroke();poly(4,16,Math.PI/4);ctx.stroke();ctx.shadowBlur=0;ctx.globalCompositeOperation='lighter';spr('#5bff8a',4,0,0);break;
    case 'boss':drawBoss(e);break;
  }
  ctx.restore();
  if(e.type!=='boss'&&e.maxhp>20&&e.hp<e.maxhp){ctx.fillStyle='#ff3b6b';ctx.fillRect(e.x-e.r,e.y-e.r-8,2*e.r*Math.max(0,e.hp/e.maxhp),3);}
}
function drawPlayer(){
  if(P.dead>0||state==='over')return;
  ctx.save();ctx.translate(P.x,P.y);
  if(P.inv>0&&(frame>>2)%2)ctx.globalAlpha=0.35;
  ctx.globalCompositeOperation='lighter';spr('#3b9dff',5+Math.random()*2,0,14);ctx.globalCompositeOperation='source-over';
  ctx.scale(1-Math.abs(P.tilt)*0.25,1);
  ctx.shadowBlur=16;ctx.shadowColor='#3bf0ff';
  const g=ctx.createLinearGradient(0,-18,0,12);g.addColorStop(0,'#e0ffff');g.addColorStop(1,'#2060ff');
  ctx.fillStyle=g;ctx.strokeStyle='#bfffff';ctx.lineWidth=1.5;
  ctx.beginPath();[[0,-20],[5,-6],[15,6],[15,11],[5,8],[0,12],[-5,8],[-15,11],[-15,6],[-5,-6]].forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff3bd0';ctx.beginPath();ctx.ellipse(0,-4,2.5,5,0,0,TAU);ctx.fill();
  ctx.restore();
  if(P.power>=3)for(const s of[-1,1]){ctx.save();ctx.translate(P.x+s*16,P.y+2);ctx.rotate(frame*0.1*s);ctx.strokeStyle='#ff8a3b';ctx.shadowBlur=8;ctx.shadowColor='#ff8a3b';ctx.lineWidth=1.5;ctx.strokeRect(-4,-4,8,8);ctx.restore();}
  if(P.focus){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(frame*0.05);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.stroke();ctx.restore();}
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#ff3030';ctx.lineWidth=P.focus?2:1;ctx.beginPath();ctx.arc(P.x,P.y,P.focus?4:2.5,0,TAU);ctx.fill();ctx.stroke();
}
function miniShip(x,y){ctx.fillStyle='#3bf0ff';ctx.shadowColor='#3bf0ff';ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+7,y+6);ctx.lineTo(x,y+3);ctx.lineTo(x-7,y+6);ctx.closePath();ctx.fill();}
function hud(){
  ctx.save();ctx.font='bold 16px "Courier New",monospace';ctx.shadowBlur=8;
  ctx.shadowColor='#3bf0ff';ctx.fillStyle='#d0ffff';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(9,'0'),12,24);
  ctx.textAlign='right';ctx.fillStyle='#ffd0f0';ctx.shadowColor='#ff3bd0';ctx.fillText('HI '+String(Math.max(hi,score)).padStart(9,'0'),W-12,24);
  ctx.textAlign='left';ctx.font='bold 13px "Courier New",monospace';ctx.fillStyle='#c0a0ff';ctx.shadowColor='#7b5bff';ctx.fillText('STAGE '+stage+'   GRAZE '+graze,12,42);
  if(combo>=5){ctx.textAlign='right';ctx.fillStyle='#ffd23b';ctx.shadowColor='#ffd23b';ctx.fillText(combo+' CHAIN  x'+mult().toFixed(1),W-12,42);}
  if(boss){const r=Math.max(0,boss.hp/boss.maxhp);ctx.shadowColor='#ff3bd0';ctx.strokeStyle='#ff3bd0';ctx.lineWidth=1;ctx.strokeRect(20,52,W-40,8);
    const g=ctx.createLinearGradient(20,0,W-20,0);g.addColorStop(0,'#ff3030');g.addColorStop(1,'#ff3bd0');ctx.fillStyle=g;ctx.fillRect(20,52,(W-40)*r,8);
    ctx.fillStyle='#ffffff';for(const n of[0.33,0.66])ctx.fillRect(20+(W-40)*n-1,50,2,12);}
  for(let i=0;i<P.lives;i++)miniShip(18+i*20,H-18);
  for(let i=0;i<P.bombs;i++){const x=18+i*20,y=H-42;ctx.strokeStyle='#5bff8a';ctx.shadowColor='#5bff8a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.stroke();ctx.fillStyle='#5bff8a';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('B',x,y+3);}
  ctx.textAlign='right';ctx.font='bold 12px "Courier New",monospace';ctx.fillStyle='#ffd23b';ctx.shadowColor='#ffd23b';ctx.fillText('POWER',W-100,H-14);
  for(let i=0;i<5;i++){ctx.fillStyle=i<P.power?'#ffd23b':'rgba(255,210,59,0.15)';ctx.fillRect(W-94+i*16,H-24,12,10);}
  ctx.restore();}
function drawBanner(){const b=banner;const a=Math.max(0,Math.min(1,b.t/20,(150-b.t)/15));ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
  if(b.a==='WARNING'){ctx.fillStyle='rgba(255,0,0,'+(0.15+0.1*Math.sin(frame*0.3))+')';ctx.fillRect(0,H/2-60,W,110);}
  ctx.shadowBlur=20;ctx.shadowColor=b.c;ctx.fillStyle=b.c;ctx.font='bold 44px "Arial Black",Impact,sans-serif';ctx.fillText(b.a,W/2,H/2);
  ctx.font='bold 16px monospace';ctx.fillStyle='#ffffff';ctx.fillText(b.b,W/2,H/2+32);ctx.restore();}
function drawTitle(){
  ctx.save();ctx.textAlign='center';const y=230+Math.sin(frame*0.03)*6;
  ctx.font='bold 64px "Arial Black",Impact,sans-serif';ctx.shadowBlur=30;ctx.shadowColor='#ff3bd0';ctx.fillStyle='#ffe0f8';ctx.fillText('NEON',W/2,y);
  ctx.shadowColor='#3bf0ff';ctx.fillStyle='#e0ffff';ctx.fillText('STRIKE',W/2,y+68);
  ctx.shadowBlur=0;ctx.font='13px monospace';ctx.fillStyle='#a090ff';ctx.fillText(' ARCADE BULLET HELL ',W/2,y+100);
  if((frame>>5)%2===0){ctx.font='bold 20px monospace';ctx.fillStyle='#ffffff';ctx.shadowBlur=12;ctx.shadowColor='#ffffff';ctx.fillText('PRESS SPACE / TAP',W/2,450);}
  ctx.shadowBlur=0;ctx.font='13px "Hiragino Kaku Gothic ProN",Meiryo,sans-serif';ctx.fillStyle='#c8c0ff';
  ['矢印 / WASD 移動','SHIFT 低速移動','X ボム','P / Esc 一時停止','M 音楽　Enter 再挑戦','スマホ：なぞって移動・自動発射','CHAIN x5 でスコア倍率UP'].forEach((s,i)=>ctx.fillText(s,W/2,510+i*22));
  ctx.font='bold 14px monospace';ctx.fillStyle='#ffd23b';ctx.fillText('HI-SCORE '+hi,W/2,690);ctx.restore();}
function drawOver(){ctx.fillStyle='rgba(5,0,15,'+Math.min(0.7,overT/60)+')';ctx.fillRect(0,0,W,H);ctx.save();ctx.textAlign='center';
  ctx.font='bold 52px "Arial Black",Impact,sans-serif';ctx.shadowBlur=25;ctx.shadowColor='#ff3030';ctx.fillStyle='#ffd0d0';ctx.fillText('GAME OVER',W/2,280);
  ctx.font='bold 22px monospace';ctx.shadowColor='#3bf0ff';ctx.fillStyle='#ffffff';ctx.fillText('SCORE '+score,W/2,340);
  ctx.font='16px monospace';ctx.fillText('STAGE '+stage+'  /  GRAZE '+graze,W/2,370);
  if(newRec&&(frame>>3)%2){ctx.fillStyle='#ffd23b';ctx.shadowColor='#ffd23b';ctx.font='bold 24px monospace';ctx.fillText('NEW RECORD!',W/2,410);}
  if(overT>60&&(frame>>5)%2===0){ctx.font='bold 18px "Hiragino Kaku Gothic ProN",Meiryo,monospace';ctx.fillStyle='#ffffff';ctx.shadowColor='#ffffff';ctx.fillText('SPACE / ',W/2,480);}
  ctx.restore();}
function drawPause(){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.save();ctx.textAlign='center';ctx.font='bold 48px "Arial Black",Impact,sans-serif';ctx.shadowBlur=20;ctx.shadowColor='#3bf0ff';ctx.fillStyle='#ffffff';ctx.fillText('PAUSE',W/2,H/2);ctx.font='14px monospace';ctx.fillText('P / TAP TO RESUME',W/2,H/2+34);ctx.restore();}

function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  drawBG();
  ctx.save();
  if(shake>0.3)ctx.translate(rnd(-shake,shake)*0.6,rnd(-shake,shake)*0.6);
  if(state!=='title'){
    for(const t of it)drawItem(t);
    for(const e of en)drawEnemy(e);
    ctx.globalCompositeOperation='lighter';
    for(const b of pb)spr(b.m?'#ff8a3b':'#3bb8ff',3,b.x,b.y);
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#e8ffff';for(const b of pb)if(!b.m)ctx.fillRect(b.x-1.5,b.y-9,3,18);
    drawPlayer();
    ctx.globalCompositeOperation='lighter';
    for(const p of pt){ctx.globalAlpha=Math.max(0,p.l/p.m);if(p.k){ctx.strokeStyle=p.c;ctx.lineWidth=p.w;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();}else spr(p.c,p.s,p.x,p.y);}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    for(const b of eb)spr(b.c,b.r,b.x,b.y);
    ctx.font='bold 14px monospace';ctx.textAlign='center';
    for(const t of pops){ctx.globalAlpha=Math.min(1,t.l/20);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y);}
    ctx.globalAlpha=1;
  }
  ctx.restore();
  if(flash>0.02){ctx.fillStyle=`rgba(255,255,255,${Math.min(0.8,flash)})`;ctx.fillRect(0,0,W,H);}
  if(state==='title')drawTitle();else{hud();if(banner)drawBanner();if(state==='over')drawOver();if(paused)drawPause();}
}

/* ================= LOOP ================= */
function update(){
  musicTick();
  if(paused){startPress=false;bombReq=false;return;}
  frame++;
  for(const s of stars){s.y+=s.z*(boss?9:5);if(s.y>H){s.y=-4;s.x=Math.random()*W;}}
  if(state==='title'){if(startPress){reset();state='play';}}
  else if(state==='play'){waves();runSched();updPlayer();if(state==='play'){updPB();updEN();updEB();updIT();}if(comboT>0&&--comboT===0)combo=0;}
  else if(state==='over'){overT++;if(startPress&&overT>60){reset();state='play';}}
  updPT();
  for(const t of pops){t.y-=0.6;t.l--;}pops=pops.filter(t=>t.l>0);
  if(banner&&--banner.t<=0)banner=null;
  shake*=0.88;if(shake<0.3)shake=0;flash*=0.88;
  startPress=false;bombReq=false;
}
let last=performance.now(),acc=0;const DT=1000/60;
function loop(now){acc+=Math.min(200,now-last);last=now;let n=0;while(acc>=DT&&n<5){update();acc-=DT;n++;}if(n>=5)acc=0;render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  initAudio();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ')startPress=true;
  if(e.code==='KeyX')bombReq=true;
  if((e.code==='KeyP'||e.code==='Escape')&&state==='play')paused=!paused;
  if(e.code==='KeyM')music=!music;
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')paused=true;});
let tid=null,tX0=0,tY0=0;
document.addEventListener('touchstart',e=>{e.preventDefault();initAudio();
  if(state!=='play'){startPress=true;return;}
  if(paused){paused=false;return;}
  if(e.touches.length>=2)bombReq=true;
  if(tid===null){const t=e.changedTouches[0];tid=t.identifier;tX0=t.clientX;tY0=t.clientY;}},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===tid){
  const dx=(t.clientX-tX0)/CSS*1.5,dy=(t.clientY-tY0)/CSS*1.5;
  if(state==='play'&&!paused&&!P.dead){P.x=clamp(P.x+dx,10,W-10);P.y=clamp(P.y+dy,20,H-16);touchDX+=dx;}
  tX0=t.clientX;tY0=t.clientY;}}},{passive:false});
const tend=e=>{for(const t of e.changedTouches)if(t.identifier===tid)tid=null;};
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);
cv.addEventListener('mousedown',()=>{initAudio();if(state!=='play')startPress=true;else if(paused)paused=false;});
})();
</script>
